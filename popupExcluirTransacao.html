<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Excluir Transação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
      text-align: center;
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      text-align: left;
    }
    select, input, button {
      width: 90%;
      padding: 10px;
      margin: 8px auto;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
      display: block;
    }
    button {
      background-color: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }
    th {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Excluir Transação</h2>
  
  <label for="tipoTransacao">Selecione o Tipo:</label>
  <select id="tipoTransacao">
    <option value="Despesa">Despesa</option>
    <option value="Receita">Receita</option>
  </select>
  
  <label for="mes">Selecione o Mês:</label>
  <select id="mes">
    <option value="1">Janeiro</option>
    <option value="2">Fevereiro</option>
    <option value="3">Março</option>
    <option value="4">Abril</option>
    <option value="5">Maio</option>
    <option value="6">Junho</option>
    <option value="7">Julho</option>
    <option value="8">Agosto</option>
    <option value="9">Setembro</option>
    <option value="10">Outubro</option>
    <option value="11">Novembro</option>
    <option value="12">Dezembro</option>
  </select>
  
  <label for="ano">Selecione o Ano:</label>
  <select id="ano">
    <option value="2025">2025</option>
    <option value="2026">2026</option>
    <option value="2027">2027</option>
    <option value="2028">2028</option>
    <option value="2029">2029</option>
    <option value="2030">2030</option>
  </select>
  
  <label for="filtro">Digite parte da descrição (opcional):</label>
  <input type="text" id="filtro" placeholder="Descrição">
  
  <button onclick="buscarTransacoes()">Buscar Transações</button>
  
  <div id="resultado"></div>
  
  <script>
    function buscarTransacoes() {
      var tipo = document.getElementById("tipoTransacao").value;
      var mes = document.getElementById("mes").value;
      var ano = document.getElementById("ano").value;
      var filtro = document.getElementById("filtro").value;
      google.script.run.withSuccessHandler(function(html) {
        document.getElementById("resultado").innerHTML = html;
      }).buscarTransacoesExcluir(tipo, mes, ano, filtro);
    }
  </script>
</body>
</html>
